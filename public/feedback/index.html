<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hadron Language - Feedback</title>
  <meta name="description"
    content="Hadron is a versatile programming language with simple syntax, ideal for scripting and large-scale applications. Transcompile to various languages or run it interpreted for modern, adaptable software solutions.">
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <main>
    <section id="hero" class="feedback">
      <div class="blur-behind-1" aria-hidden="true">
        <div></div>
      </div>
      <a class="donate-button" href="https://ko-fi.com/hadronlang">Donate</a>
      <div class="name-wrapper">
        <span>Hadron</span>
      </div>
      <div class="badge">
        Pre-Alpha Development Stage
      </div>
      <div class="hero-content">
        <h1 class="hero-title">Feedback Form</h1>
        <form action="/feedback" method="post">
          <select name="type">
            <option value="bug">Bug Report</option>
            <option value="feature">Feature Request</option>
          </select>
          <textarea placeholder="Your message..." required name="message"></textarea>
          <input placeholder="Display name (optional)" type="text" name="display_name">
          <input type="email" name="email" placeholder="Email (optional)">
          <button type="submit">Submit</button>
        </form>
      </div>
      <div class="blur-behind-2" aria-hidden="true">
        <div></div>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2024-2025 The Hadron Language
  </footer>
</body>

</html>
